<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>谁在水积分 · SWTT海洋大富翁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #072e33 0%, #0c4a4f 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Arial', 'Microsoft YaHei', sans-serif;
            padding: 20px;
        }

        .game-container {
            background-color: #032b2f;
            border-radius: 32px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 0 4px #7ab7b0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            width: fit-content;
            margin: 0 auto;
        }

        h1 {
            color: #f9eec1;
            text-shadow: 3px 3px 0 #0b3b3b, 0 0 15px #5daaaa;
            letter-spacing: 4px;
            margin-bottom: 15px;
            font-size: 2.8rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1 span {
            font-size: 2.5rem;
        }

        .main-layout {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 16px;
            flex-wrap: nowrap;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 240px;
            flex-shrink: 0;
        }

        .notepad {
            background: #f9f4e0;
            border: 3px solid #c9a76b;
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(255, 255, 220, 0.5);
            display: flex;
            flex-direction: column;
            gap: 6px;
            background-image: linear-gradient(180deg, #fff8e7 0%, #f7ecc7 100%);
            transition: transform 0.1s;
        }
        .notepad:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
        }

        .np-avatar-area {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            width: 60px;
            height: 60px;
            margin: 0 auto;
            border-radius: 50%;
            background: #e0d7c0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 2px dashed #b9a86c;
            transition: border 0.2s;
        }
        .np-avatar-area:hover {
            border-color: #e6b85c;
        }
        .np-avatar-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            pointer-events: none;
        }
        .np-avatar-placeholder {
            font-size: 2rem;
            color: #8a7b5c;
            pointer-events: none;
        }

        .np-score-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            flex-wrap: nowrap;
        }
        .np-score-row label {
            font-weight: bold;
            color: #3b4a2c;
            font-size: 0.8rem;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .np-score-row input {
            padding: 3px 6px;
            border-radius: 20px;
            border: 1px solid #b9a86c;
            background: #fffef5;
            color: #2b3b1b;
            font-weight: bold;
            font-size: 0.8rem;
            text-align: center;
            outline: none;
            transition: 0.2s;
            min-width: 0;
        }
        .np-score-row input.score-value-input {
            width: 62px;
            flex-shrink: 1;
        }
        .np-score-row input.score-delta-input {
            width: 50px;
            flex-shrink: 1;
            background: #fffef9;
            border-style: dashed;
            font-size: 0.7rem;
            color: #5a6b3b;
        }
        .np-score-row input.score-delta-input::placeholder {
            color: #b9a88c;
            font-style: italic;
            font-size: 0.65rem;
        }
        .np-score-row input:focus {
            border-color: #e6b85c;
            box-shadow: 0 0 8px #f5c96a;
        }

        .np-notes {
            width: 100%;
            min-height: 60px;
            max-height: 110px;
            background: rgba(255, 255, 240, 0.9);
            border: 1px solid #d6c694;
            border-radius: 10px;
            padding: 6px;
            font-size: 0.8rem;
            color: #2e3820;
            outline: none;
            overflow-y: auto;
            word-break: break-word;
            line-height: 1.4;
            cursor: text;
            user-select: text;
            background-image: repeating-linear-gradient(transparent, transparent 22px, #e6d7b0 23px);
        }
        .np-notes:empty:before {
            content: "点击编辑文字...";
            color: #968c6e;
            font-style: italic;
            font-size: 0.75rem;
        }
        .np-notes:focus {
            border-color: #e6b85c;
            box-shadow: 0 0 6px #f5c96a;
        }

        .center-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .board-wrapper {
            position: relative;
            display: inline-block;
            border: 6px solid #c9a76b;
            border-radius: 24px;
            overflow: hidden;
            background-color: #1e4b4f;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #board {
            position: relative;
            width: 1100px;
            height: 700px;
            background-image: url('board.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #1a4a4a;
            cursor: default;
        }

        .controls-container {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(0, 30, 30, 0.8);
            border-radius: 30px;
            padding: 8px 18px;
            backdrop-filter: blur(8px);
            margin: 0;
            font-size: 0.75rem;
        }

        .upload-area {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #d4f0f0;
            font-weight: bold;
            background: #0a4245;
            padding: 4px 12px;
            border-radius: 25px;
            font-size: 0.7rem;
        }
        .file-label {
            background: #2c7a7a;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #8fd9d9;
            font-size: 0.7rem;
            white-space: nowrap;
        }
        .file-label:hover {
            background: #309090;
        }
        input[type="file"] {
            display: none;
        }
        button {
            background: #e6b85c;
            border: none;
            color: #1e3b3b;
            font-weight: bold;
            font-size: 0.7rem;
            padding: 6px 14px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            letter-spacing: 1px;
            border: 2px solid #f5d78c;
            white-space: nowrap;
        }
        button:hover {
            background: #f5c96a;
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.6);
        }
        button.clear-btn {
            background: #4a6b6b;
            color: #f0f0d0;
            border-color: #8baaaa;
        }
        button.clear-btn:hover {
            background: #5e7e7e;
        }

        .folder-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .folder-btn {
            background: #2c6b6b;
            border-color: #7eb9b9;
            color: #f0f5e0;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            padding: 5px 12px;
        }
        .folder-btn:hover {
            background: #3a7a7a;
        }
        .draw-btn {
            background: #d9a646;
            border-color: #f5d15c;
            color: #123;
            font-weight: bold;
            font-size: 0.7rem;
            padding: 5px 12px;
        }
        .draw-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .info-text {
            color: #b3d9d9;
            font-style: italic;
            font-size: 0.65rem;
            margin-left: 2px;
        }
        .selected-file-name {
            color: #f7e3b2;
            max-width: 110px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
            font-size: 0.7rem;
        }
        .folder-buttons span {
            font-size: 0.7rem;
        }

        .player-marker {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 65px;
            z-index: 10;
            pointer-events: auto;
            transition: transform 0.1s ease;
        }

        .player-image-container {
            position: relative;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            cursor: grab;
            background: rgba(255, 255, 240, 0.9);
            border: none;
        }
        .player-marker.dragging .player-image-container {
            cursor: grabbing;
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
        }

        .player-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .delete-player-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 18px;
            height: 18px;
            background: #c44;
            color: white;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            line-height: 16px;
            text-align: center;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 6px black;
            z-index: 20;
            pointer-events: auto;
        }
        .delete-player-btn:hover {
            background: #e55;
            transform: scale(1.15);
        }

        .card-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .card-modal.show {
            visibility: visible;
            opacity: 1;
        }
        .card-content {
            background: #0f3b3b;
            border: 4px solid #dbb45c;
            border-radius: 28px;
            padding: 30px;
            max-width: 640px;
            max-height: 840px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 40px black;
        }
        .card-content img {
            max-width: 560px;
            max-height: 640px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        }
        .close-btn {
            margin-top: 20px;
            background: #b45;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        footer {
            margin-top: 12px;
            color: #8ab5b5;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>
            <span>🍏</span> 谁在水积分 <span>🍅</span>
        </h1>

        <div class="main-layout">
            <div class="side-panel" id="leftPanel"></div>

            <div class="center-column">
                <div class="board-wrapper">
                    <div id="board"></div>
                </div>
                <div class="controls-container">
                    <div class="controls">
                        <div class="upload-area">
                            <label for="playerImageInput" class="file-label">📁 选择玩家图片</label>
                            <input type="file" id="playerImageInput" accept="image/*">
                            <span id="fileNameDisplay" class="selected-file-name">未选择</span>
                        </div>
                        <button id="addPlayerBtn">➕ 添加玩家</button>
                        <button id="clearAllBtn" class="clear-btn">🗑️ 移除全部</button>
                        <span class="info-text">💡 拖动玩家移动，计分在两侧记事本</span>
                    </div>
                    <div class="controls">
                        <div class="folder-buttons">
                            <button id="loadMingyunBtn" class="folder-btn">📂 命运文件夹</button>
                            <button id="drawMingyunBtn" class="draw-btn" disabled>🎴 命运</button>
                            <span id="mingyunCount" style="color:#b4d4c0;">0张</span>
                        </div>
                        <div class="folder-buttons">
                            <button id="loadJihuiBtn" class="folder-btn">📂 机会文件夹</button>
                            <button id="drawJihuiBtn" class="draw-btn" disabled>🎴 机会</button>
                            <span id="jihuiCount" style="color:#b4d4c0;">0张</span>
                        </div>
                        <div class="folder-buttons">
                            <button id="loadDaojuBtn" class="folder-btn">📂 道具文件夹</button>
                            <button id="drawDaojuBtn" class="draw-btn" disabled>🎴 道具</button>
                            <span id="daojuCount" style="color:#b4d4c0;">0张</span>
                        </div>
                        <span class="info-text">⭐ 点击文件夹按钮，再抽卡</span>
                    </div>
                </div>
            </div>

            <div class="side-panel" id="rightPanel"></div>
        </div>

        <footer>🌊 SWTT 洋界乒联 · 谁在水积分 · 仅供娱乐 🌊</footer>
    </div>

    <div id="cardModal" class="card-modal">
        <div class="card-content">
            <img id="cardImage" src="" alt="抽到的卡片">
            <button class="close-btn" id="closeModalBtn">关闭</button>
        </div>
    </div>

    <script>
        (function() {
            const board = document.getElementById('board');
            const fileInput = document.getElementById('playerImageInput');
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            const addPlayerBtn = document.getElementById('addPlayerBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const leftPanel = document.getElementById('leftPanel');
            const rightPanel = document.getElementById('rightPanel');

            const loadMingyunBtn = document.getElementById('loadMingyunBtn');
            const loadJihuiBtn = document.getElementById('loadJihuiBtn');
            const loadDaojuBtn = document.getElementById('loadDaojuBtn');
            const drawMingyunBtn = document.getElementById('drawMingyunBtn');
            const drawJihuiBtn = document.getElementById('drawJihuiBtn');
            const drawDaojuBtn = document.getElementById('drawDaojuBtn');
            const mingyunCount = document.getElementById('mingyunCount');
            const jihuiCount = document.getElementById('jihuiCount');
            const daojuCount = document.getElementById('daojuCount');

            const cardModal = document.getElementById('cardModal');
            const cardImage = document.getElementById('cardImage');
            const closeModalBtn = document.getElementById('closeModalBtn');

            let selectedPlayerImageFile = null;
            let playerIdCounter = 0;

            const cardPools = {
                mingyun: [],
                jihui: [],
                daoju: []
            };

            let dragState = {
                active: false,
                marker: null,
                startX: 0,
                startY: 0,
                startLeft: 0,
                startTop: 0
            };

            // ---------- 创建两侧记事本 (共8个) ----------
            function createNotepad(panel, index) {
                const notepad = document.createElement('div');
                notepad.className = 'notepad';
                notepad.setAttribute('data-notepad-id', index);

                const avatarArea = document.createElement('div');
                avatarArea.className = 'np-avatar-area';
                avatarArea.title = '点击上传头像';
                const avatarImg = document.createElement('img');
                avatarImg.src = '';
                avatarImg.style.display = 'none';
                const placeholder = document.createElement('span');
                placeholder.className = 'np-avatar-placeholder';
                placeholder.textContent = '👤';
                avatarArea.appendChild(avatarImg);
                avatarArea.appendChild(placeholder);

                const avatarInput = document.createElement('input');
                avatarInput.type = 'file';
                avatarInput.accept = 'image/*';
                avatarInput.style.display = 'none';
                avatarInput.setAttribute('data-notepad-id', index);
                avatarArea.appendChild(avatarInput);

                avatarArea.addEventListener('click', (e) => {
                    e.stopPropagation();
                    avatarInput.click();
                });

                avatarInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        avatarImg.src = ev.target.result;
                        avatarImg.style.display = 'block';
                        placeholder.style.display = 'none';
                    };
                    reader.readAsDataURL(file);
                    avatarInput.value = '';
                });

                // ========== 积分行：双输入框 ==========
                const scoreRow = document.createElement('div');
                scoreRow.className = 'np-score-row';

                const scoreLabel = document.createElement('label');
                scoreLabel.textContent = '🏆 积分';
                scoreLabel.title = '手动设置积分值';

                // 积分值输入框（手动填写）
                const scoreInput = document.createElement('input');
                scoreInput.type = 'text';
                scoreInput.value = '0';
                scoreInput.placeholder = '积分';
                scoreInput.className = 'score-value-input';
                scoreInput.title = '手动设置积分值';

                // 增减量输入框（+数字或-数字，自动结算）
                const deltaInput = document.createElement('input');
                deltaInput.type = 'text';
                deltaInput.value = '';
                deltaInput.placeholder = '+/-';
                deltaInput.className = 'score-delta-input';
                deltaInput.title = '输入增减量（如+5或-3），回车或失焦自动结算';

                // ---- 结算逻辑 ----
                function applyDelta() {
                    const deltaRaw = deltaInput.value.trim();
                    if (deltaRaw === '') return; // 空值不处理

                    // 解析增量
                    const deltaNum = parseFloat(deltaRaw);
                    if (isNaN(deltaNum)) {
                        // 无法解析为数字，清空并忽略
                        deltaInput.value = '';
                        return;
                    }

                    // 解析当前积分
                    const currentScore = parseFloat(scoreInput.value);
                    const baseScore = isNaN(currentScore) ? 0 : currentScore;

                    // 计算新积分
                    const newScore = baseScore + deltaNum;

                    // 更新积分输入框（保留合理的小数位数）
                    scoreInput.value = Number.isInteger(newScore) ? newScore.toString() : parseFloat(newScore.toFixed(6)).toString();

                    // 清空增量输入框
                    deltaInput.value = '';
                }

                // 失去焦点时自动结算
                deltaInput.addEventListener('blur', () => {
                    applyDelta();
                });

                // 按下回车键时自动结算
                deltaInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        applyDelta();
                        // 结算后让增量框失去焦点，方便查看积分变化
                        deltaInput.blur();
                    }
                });

                scoreRow.appendChild(scoreLabel);
                scoreRow.appendChild(scoreInput);
                scoreRow.appendChild(deltaInput);
                // ========== 积分行结束 ==========

                const notesDiv = document.createElement('div');
                notesDiv.className = 'np-notes';
                notesDiv.contentEditable = 'true';
                notesDiv.setAttribute('data-placeholder', '点击编辑文字...');

                notepad.appendChild(avatarArea);
                notepad.appendChild(scoreRow);
                notepad.appendChild(notesDiv);

                panel.appendChild(notepad);
            }

            for (let i = 0; i < 4; i++) {
                createNotepad(leftPanel, i);
            }
            for (let i = 4; i < 8; i++) {
                createNotepad(rightPanel, i);
            }

            // ---------- 辅助函数 ----------
            function showModal(imageSrc) {
                cardImage.src = imageSrc;
                cardModal.classList.add('show');
            }
            function hideModal() {
                cardModal.classList.remove('show');
                cardImage.src = '';
            }

            function getRandomImage(poolArray) {
                if (!poolArray || poolArray.length === 0) return null;
                const index = Math.floor(Math.random() * poolArray.length);
                return poolArray[index];
            }

            function setupFolderLoader(loadBtn, drawBtn, countSpan, poolKey) {
                const folderInput = document.createElement('input');
                folderInput.type = 'file';
                folderInput.webkitdirectory = true;
                folderInput.directory = true;
                folderInput.multiple = true;
                folderInput.accept = 'image/*';
                folderInput.style.display = 'none';
                document.body.appendChild(folderInput);

                loadBtn.addEventListener('click', () => {
                    folderInput.click();
                });

                folderInput.addEventListener('change', (e) => {
                    const files = Array.from(e.target.files);
                    if (files.length === 0) return;

                    cardPools[poolKey] = [];
                    let loadedCount = 0;
                    const imageFiles = files.filter(f => f.type.startsWith('image/'));

                    if (imageFiles.length === 0) {
                        countSpan.textContent = '0张';
                        drawBtn.disabled = true;
                        alert('所选文件夹中没有图片文件。');
                        folderInput.value = '';
                        return;
                    }

                    imageFiles.forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            cardPools[poolKey].push(ev.target.result);
                            loadedCount++;
                            countSpan.textContent = loadedCount + '张';
                            if (loadedCount === imageFiles.length) {
                                drawBtn.disabled = false;
                            }
                        };
                        reader.onerror = () => {
                            loadedCount++;
                            if (loadedCount === imageFiles.length) {
                                drawBtn.disabled = cardPools[poolKey].length === 0;
                            }
                        };
                        reader.readAsDataURL(file);
                    });

                    folderInput.value = '';
                });
            }

            setupFolderLoader(loadMingyunBtn, drawMingyunBtn, mingyunCount, 'mingyun');
            setupFolderLoader(loadJihuiBtn, drawJihuiBtn, jihuiCount, 'jihui');
            setupFolderLoader(loadDaojuBtn, drawDaojuBtn, daojuCount, 'daoju');

            drawMingyunBtn.addEventListener('click', () => {
                const img = getRandomImage(cardPools.mingyun);
                if (img) showModal(img);
                else alert('命运卡池为空，请先加载命运文件夹。');
            });
            drawJihuiBtn.addEventListener('click', () => {
                const img = getRandomImage(cardPools.jihui);
                if (img) showModal(img);
                else alert('机会卡池为空，请先加载机会文件夹。');
            });
            drawDaojuBtn.addEventListener('click', () => {
                const img = getRandomImage(cardPools.daoju);
                if (img) showModal(img);
                else alert('道具卡池为空，请先加载道具文件夹。');
            });

            closeModalBtn.addEventListener('click', hideModal);
            cardModal.addEventListener('click', (e) => {
                if (e.target === cardModal) hideModal();
            });

            // ---------- 玩家标记创建 ----------
            function createPlayerMarker(imageFile) {
                if (!imageFile) {
                    alert('请先选择一个玩家图片！');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgDataUrl = e.target.result;
                    const playerId = `player-${++playerIdCounter}`;

                    const marker = document.createElement('div');
                    marker.className = 'player-marker';
                    marker.setAttribute('data-player-id', playerId);

                    const boardWidth = 1100;
                    const boardHeight = 700;
                    const randomLeft = Math.min(boardWidth - 65, Math.max(5, Math.random() * (boardWidth - 65)));
                    const randomTop = Math.min(boardHeight - 65, Math.max(5, Math.random() * (boardHeight - 65)));
                    marker.style.left = randomLeft + 'px';
                    marker.style.top = randomTop + 'px';

                    const imgContainer = document.createElement('div');
                    imgContainer.className = 'player-image-container';

                    const img = document.createElement('img');
                    img.src = imgDataUrl;
                    img.alt = '玩家';
                    img.draggable = false;
                    imgContainer.appendChild(img);

                    const delBtn = document.createElement('div');
                    delBtn.className = 'delete-player-btn';
                    delBtn.innerHTML = '×';
                    delBtn.title = '删除玩家';
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        marker.remove();
                    });
                    imgContainer.appendChild(delBtn);

                    marker.appendChild(imgContainer);

                    marker.addEventListener('mousedown', onDragStart);
                    marker.addEventListener('touchstart', onDragStart, { passive: false });

                    board.appendChild(marker);
                };

                reader.onerror = () => alert('读取图片失败。');
                reader.readAsDataURL(imageFile);
            }

            // ---------- 拖动逻辑 ----------
            function onDragStart(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) {
                    return;
                }
                e.preventDefault();

                const marker = e.currentTarget;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const left = parseFloat(marker.style.left) || 0;
                const top = parseFloat(marker.style.top) || 0;

                dragState.active = true;
                dragState.marker = marker;
                dragState.startX = clientX;
                dragState.startY = clientY;
                dragState.startLeft = left;
                dragState.startTop = top;

                marker.classList.add('dragging');
                marker.style.zIndex = '100';

                window.addEventListener('mousemove', onDragMove);
                window.addEventListener('mouseup', onDragEnd);
                window.addEventListener('touchmove', onDragMove, { passive: false });
                window.addEventListener('touchend', onDragEnd);
                window.addEventListener('touchcancel', onDragEnd);
            }

            function onDragMove(e) {
                if (!dragState.active || !dragState.marker) return;
                e.preventDefault();

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const dx = clientX - dragState.startX;
                const dy = clientY - dragState.startY;

                let newLeft = dragState.startLeft + dx;
                let newTop = dragState.startTop + dy;

                const marker = dragState.marker;
                const boardRect = board.getBoundingClientRect();
                const markerWidth = marker.offsetWidth || 65;
                const markerHeight = marker.offsetHeight || 65;

                const maxLeft = boardRect.width - markerWidth;
                const maxTop = boardRect.height - markerHeight;

                newLeft = Math.min(Math.max(newLeft, 0), maxLeft);
                newTop = Math.min(Math.max(newTop, 0), maxTop);

                marker.style.left = newLeft + 'px';
                marker.style.top = newTop + 'px';
            }

            function onDragEnd() {
                if (!dragState.active) return;
                if (dragState.marker) {
                    dragState.marker.classList.remove('dragging');
                    dragState.marker.style.zIndex = '10';
                }
                dragState.active = false;
                dragState.marker = null;

                window.removeEventListener('mousemove', onDragMove);
                window.removeEventListener('mouseup', onDragEnd);
                window.removeEventListener('touchmove', onDragMove);
                window.removeEventListener('touchend', onDragEnd);
                window.removeEventListener('touchcancel', onDragEnd);
            }

            window.addEventListener('blur', () => {
                if (dragState.active) onDragEnd();
            });

            // ---------- 玩家图片选择 ----------
            fileInput.addEventListener('change', (e) => {
                const files = e.target.files;
                if (files && files.length > 0) {
                    selectedPlayerImageFile = files[0];
                    fileNameDisplay.textContent = selectedPlayerImageFile.name;
                } else {
                    selectedPlayerImageFile = null;
                    fileNameDisplay.textContent = '未选择';
                }
            });

            addPlayerBtn.addEventListener('click', () => {
                if (!selectedPlayerImageFile) {
                    alert('请先选择一个玩家图片！');
                    return;
                }
                createPlayerMarker(selectedPlayerImageFile);
            });

            clearAllBtn.addEventListener('click', () => {
                const markers = board.querySelectorAll('.player-marker');
                if (markers.length === 0) {
                    alert('棋盘上没有玩家标记。');
                    return;
                }
                if (confirm('确定要移除所有玩家吗？')) {
                    markers.forEach(m => m.remove());
                    playerIdCounter = 0;
                }
            });

            console.log('🍏 SWTT 谁在水积分 已启动！积分栏双输入框已就绪。');
        })();
    </script>
</body>
</html>
